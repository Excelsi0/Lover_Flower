    <header class="header">
        <div class="header__logo logo">
            <span class="l">l</span><span class="f">f</span>
        </div>

        <nav class="header__nav">
            <ul class="header__menu">
                <li><a href="#" class="header__link">Каталог</a></li>
                <li><a href="#" class="header__link">Доставка и оплата</a></li>
                <li><a href="#" class="header__link">О нас</a></li>
                <li><a href="#" class="header__link">Контакты</a></li>
                <li><a href="#" class="header__link">FAQ</a></li>
                <li>
                    <button class="search__trigger js-search-trigger">
                        <img src="/src/icon/search.svg" alt="поиск" />
                        <span>Поиск</span>
                    </button>
                </li>
            </ul>
        </nav>

        <div class="header__actions">
            <a href="tel:<%= phoneNumber %>" class="header__phone js-phone">
                <img src="/src/icon/phone.svg" alt />
                <%= phoneNumber %>
            </a>
            <button class="header__btn">
                <img src="/src/icon/shop.svg" alt />
            </button>
        </div>

        <!-- Оверлей поиска -->
        <div class="search-overlay js-search">
            <input
                type="text"
                class="search-overlay__input"
                placeholder="Введите свой запрос" />
            <button class="search-overlay__close js-close-search">×</button>
        </div>
    </header>
</div>
