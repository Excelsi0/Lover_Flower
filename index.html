<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="author" content="Excelsio">
        <meta name="copyright" content="© 2025 Excelsio">

        <link rel="apple-touch-icon" sizes="180x180"
            href="/src/favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32"
            href="/src/favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16"
            href="/src/favicon/favicon-16x16.png">
        <link rel="manifest" href="src/favicon/site.webmanifest">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <body>
        <%- include('src/templates/header.html'); %>

        <section class="hero">
            <div class="container">
                <h1 class="hero__title" id="hero__title"><span

                <div class="hero__content">

                    <button class="hero__btn">смотреть каталог</button>

                <%- include('src/templates/sidebar.html'); %>
            </div>

            <div class="hero__bubble bubble__mint"></div>
            <div class="hero__bubble bubble__wine"></div>
            <img src="/src/image/main/hero__bg.png" alt="background"
                class="hero__bg">
            <div class="hero__black-bottom"></div>
        </section>

        <!-- для проверки прокрутки -->
        <section style="height: 1000px;"></section>

        <script type="module" src="/src/js/main.js"></script>
